packages:
  - app

allowBuilds:
  '@parcel/watcher': true
  desktop-notifications@file:vendor/desktop-notifications: true
  desktop-trampoline@file:vendor/desktop-trampoline: true
  dugite: true
  electron-winstaller: true
  esbuild: true
  fs-admin: true
  keytar: true
  printenvz@file:vendor/printenvz: true
  process-proxy: true
  registry-js: true
  windows-argv-parser@file:vendor/windows-argv-parser: true

overrides:
  '@types/react': 16.14.62
  '@types/react-css-transition-replace': 2.1.3
  '@types/react-css-transition-replace>@types/react': ^16.14.62
  '@types/react-virtualized': 9.7.14
  sass: 1.27.0
  typescript: 5.8.2
  webpack: 5.104.1

packageExtensions:
  desktop-notifications:
    dependencies:
      typescript: ^5.4.5
  desktop-trampoline:
    dependencies:
      typescript: ^5.4.5
  windows-argv-parser:
    dependencies:
      typescript: ^5.4.5
